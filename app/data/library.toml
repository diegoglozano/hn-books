# These ordinary words/language names require an explicit author or Open Library work link.
# Quotation marks, italics, and a reading cue alone do not identify the intended book.
ambiguous_titles = ["It", "We", "Us", "You", "Her", "Go", "Up", "On", "Python", "Rust", "Java", "SQL", "AI", "Code"]

