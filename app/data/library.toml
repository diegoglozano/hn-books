discovery_queries = [
  "What are you reading", "What books are you reading", "books you recommend",
  "favorite books", "best books", "what book", "books changed", "book recommendations",
]

# Broad title searches for historical reading discussions; deduplicated by HN ID.
backfill_queries = ["reading", "books", "book", "read", "novels", "literature"]

# A dedicated title-question filter keeps What/Which (book) are you reading threads.
# Search the shared word so optional title words do not hide otherwise eligible threads.
reading_thread_queries = ["reading"]

# These ordinary words/language names require an explicit author or Open Library work link.
# Quotation marks, italics, and a reading cue alone do not identify the intended book.
ambiguous_titles = ["It", "We", "Us", "You", "Her", "Go", "Up", "On", "Python", "Rust", "Java", "SQL", "AI", "Code"]

# Curated aliases guide extraction, never substitute for metadata resolution.
[[aliases]]
title = "Designing Data-Intensive Applications"
author = "Martin Kleppmann"
variants = ["DDIA", "Designing Data Intensive Applications", "Kleppmann's book", "Kleppmann’s book"]

[[aliases]]
title = "Structure and Interpretation of Computer Programs"
author = "Harold Abelson"
variants = ["SICP"]

[[aliases]]
title = "The Art of Computer Programming"
author = "Donald Knuth"
variants = ["TAOCP"]

[[aliases]]
title = "The Pragmatic Programmer"
author = "David Thomas"
variants = ["Pragmatic Programmer"]

[[aliases]]
title = "Gödel, Escher, Bach"
author = "Douglas Hofstadter"
variants = ["GEB", "Godel Escher Bach", "Gödel Escher Bach"]

[[aliases]]
title = "Dune"
author = "Frank Herbert"
variants = []

[[aliases]]
title = "The Rust Programming Language"
author = "Steve Klabnik"
variants = ["the Rust book"]

