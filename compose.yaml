services:
  library:
    build: .
    expose:
      - "8000"
    environment:
      DATABASE_PATH: /data/hn_books.db
      HN_THREAD_IDS: ${HN_THREAD_IDS:-49893157}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      EXTRACTION_BACKEND: ${EXTRACTION_BACKEND:-luna}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-HNOpinionatedLibrary/0.1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - library-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  library-data:
