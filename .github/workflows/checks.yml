name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv run python -m app.evaluate
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml -f compose.local.yaml config --quiet
      - run: docker compose up --build -d
      - run: |
          library_container_id="$(docker compose ps -q library)"
          docker inspect "$library_container_id" --format '{{json .HostConfig.PortBindings}}' > /tmp/library-ports.json
          python3 -c "import json; assert not json.load(open('/tmp/library-ports.json')), 'Default Compose must not publish host ports'"
          for attempt in $(seq 1 30); do
            if docker compose exec -T library python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs library
          exit 1
      - if: always()
        run: docker compose down
